<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Don't Be the Third Wheel!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="app">Loading…</div>

  <!-- Arrival-picker / Scores modal -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <h3 id="modal-title"></h3>
      <p  id="modal-sub"></p>
      <div id="modal-options"></div>
      <div class="modal-btns">
        <button id="modal-confirm" class="btn btn-primary">Confirm</button>
        <button id="modal-cancel"  class="btn btn-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    /* injected by Flask – null on the setup page */
    const GAME_ID    = {{ game_id    | tojson }};
    const TOKEN      = {{ token      | tojson }};
    const MY_IDX     = {{ player_idx | tojson }};
    const MY_NAME    = {{ player_name| tojson if player_name is defined else 'null' }};

    const LOCATION_NAMES = {1:"Coffee Shop",2:"Park",3:"Cinema",4:"Restaurant",5:"Beach",6:"Museum"};
    const CARD_ABILITIES = {
      1: {strong: "Lock an entire day (all cards immune to abilities)", normal: "Lock 2 cards on a chosen day"},
      2: {strong: "Swap any two of your own cards", normal: "Shift one of your cards to an adjacent day (wraps)"},
      3: {strong: "Swap any two cards of one opponent", normal: "Shift one opponent's card to an adjacent day (wraps)"},
      4: {strong: "Freely reorder all arrivals at a location", normal: "Swap two arrivals at a location"},
      5: {strong: "Bank +2 pts now (no day-match bonus)", normal: "Bank +1 pt now (no day-match bonus)"},
      6: {strong: "Flip one of your own face-up cards down", normal: "Flip an opponent's face-up card down"},
    };
    const LOC_COLORS = {1:"#ff9b9b",2:"#86efac",3:"#93c5fd",4:"#bef264",5:"#fde68a",6:"#c4b5fd"};
  </script>
  <script src="/static/js/game.js"></script>
</body>
</html>
